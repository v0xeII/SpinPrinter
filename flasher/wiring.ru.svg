<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Onest, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="85%" cy="0%" r="70%">
      <stop offset="0" stop-color="#ff4f9a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c151e"/>
      <stop offset="1" stop-color="#151016"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="#0a080b"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- title -->
  <text x="40" y="52" font-size="30" font-weight="800" fill="#ff8db5">SpinPrinter</text>
  <text x="232" y="52" font-size="20" font-weight="600" fill="#a88f9b">схема подключения</text>

  <!-- ============ Raspberry Pi (any 40-pin model) ============ -->
  <rect x="40" y="130" width="440" height="300" rx="18" fill="url(#board)" stroke="#2a2029" stroke-width="2"/>
  <text x="70" y="250" font-size="24" font-weight="800" fill="#f7e3ec">Raspberry Pi</text>
  <text x="70" y="276" font-size="15" fill="#a88f9b">Pi 3 · 4 · 5 · Zero 2 W: гребёнка одна и та же</text>
  
  <!-- SD card end / USB end -->
  <rect x="28" y="236" width="14" height="70" rx="3" fill="#2a2029"/>
  <text x="18" y="330" font-size="13" fill="#a88f9b" text-anchor="start">SD</text>
  <g fill="#2a2029" stroke="#4a3b44">
    <rect x="470" y="160" width="26" height="46" rx="4"/>
    <rect x="470" y="220" width="26" height="46" rx="4"/>
    <rect x="470" y="290" width="26" height="46" rx="4"/>
    <rect x="470" y="350" width="26" height="62" rx="4"/>
  </g>
  <text x="446" y="152" font-size="13" fill="#a88f9b" text-anchor="end">USB</text>
  <!-- power + HDMI on the bottom edge -->
  <rect x="96" y="420" width="34" height="18" rx="4" fill="#2a2029" stroke="#4a3b44"/>
  <rect x="300" y="420" width="62" height="20" rx="4" fill="#2a2029" stroke="#4a3b44"/>
  <text x="113" y="466" font-size="14" fill="#f7e3ec" text-anchor="middle">питание</text>
  <text x="113" y="484" font-size="13" fill="#a88f9b" text-anchor="middle">5 В, 2,5–5 А по модели</text>
  <text x="331" y="466" font-size="14" fill="#f7e3ec" text-anchor="middle">HDMI</text>
  <text x="331" y="484" font-size="13" fill="#a88f9b" text-anchor="middle">→ проектор (micro-HDMI у Pi 4/5)</text>

  <!-- the header: pin k sits in column (k-1)/2; even pins = outer row (board edge), odd = inner -->
  <rect x="62" y="134" width="392" height="54" rx="6" fill="#0a080b" stroke="#2a2029"/>
  <rect x="69" y="168" width="12" height="12" fill="#6b5560"/>
  <circle cx="75" cy="148" r="7" fill="#ff5e6c"/>
  <circle cx="94" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="94" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="113" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="113" cy="148" r="7" fill="#b9a3ae"/>
  <circle cx="132" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="132" cy="148" r="7" fill="#ffd166"/>
  <circle cx="151" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="151" cy="148" r="7" fill="#4cc9f0"/>
  <circle cx="170" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="170" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="189" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="189" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="208" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="208" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="227" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="227" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="246" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="246" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="265" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="265" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="284" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="284" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="303" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="303" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="322" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="322" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="341" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="341" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="360" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="360" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="379" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="379" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="398" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="398" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="417" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="417" cy="148" r="5" fill="#4a3b44"/>
  <circle cx="436" cy="174" r="5" fill="#4a3b44"/>
  <circle cx="436" cy="148" r="5" fill="#4a3b44"/>
  <text x="66" y="206" font-size="12" fill="#a88f9b">пин 1 (3V3)</text>

  <!-- ============ the 4 wires (nested so they never cross) ============ -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M75 141 V72 H724 V216 H768" stroke="#ff5e6c"/>
    <path d="M113 141 V88 H708 V246 H768" stroke="#b9a3ae"/>
    <path d="M132 141 V104 H692 V276 H768" stroke="#ffd166"/>
    <path d="M151 141 V120 H676 V306 H768" stroke="#4cc9f0"/>
  </g>
  <g font-size="14" font-weight="700">
    <rect x="300" y="60" width="62" height="24" rx="12" fill="#0a080b"/><text x="331" y="77" fill="#ff5e6c" text-anchor="middle">5V</text>
    <rect x="380" y="76" width="66" height="24" rx="12" fill="#0a080b"/><text x="413" y="93" fill="#b9a3ae" text-anchor="middle">GND</text>
    <rect x="452" y="92" width="96" height="24" rx="12" fill="#0a080b"/><text x="500" y="109" fill="#ffd166" text-anchor="middle">TX → RX</text>
    <rect x="556" y="108" width="96" height="24" rx="12" fill="#0a080b"/><text x="604" y="125" fill="#4cc9f0" text-anchor="middle">RX ← TX</text>
  </g>

  <!-- ============ or the USB cable ============ -->
  <path d="M498 314 C 590 314, 580 600, 690 600 H880 V574" fill="none" stroke="#ff8db5" stroke-width="3" stroke-dasharray="9 8"/>
  <rect x="534" y="498" width="214" height="40" rx="12" fill="#0a080b" stroke="#2a2029"/>
  <text x="641" y="516" font-size="14" font-weight="700" fill="#ff8db5" text-anchor="middle">или USB-кабель</text>
  <text x="641" y="532" font-size="12" fill="#a88f9b" text-anchor="middle">USB-A ↔ USB-C, с данными</text>

  <!-- ============ ESP32-S3 Super Mini ============ -->
  <rect x="768" y="140" width="250" height="420" rx="16" fill="url(#board)" stroke="#ff4f9a" stroke-opacity=".55" stroke-width="2"/>
  <rect x="855" y="548" width="50" height="22" rx="8" fill="#2a2029" stroke="#4a3b44"/>
  <text x="880" y="540" font-size="13" fill="#a88f9b" text-anchor="middle">USB-C</text>
  <text x="893" y="172" font-size="18" font-weight="800" fill="#f7e3ec" text-anchor="middle">ESP32-S3 Super Mini</text>
  <text x="893" y="192" font-size="12" fill="#a88f9b" text-anchor="middle">номера выводов = GPIO</text>
  <g font-size="15" font-weight="700">
    <circle cx="768" cy="216" r="6" fill="#ff5e6c"/><text x="784" y="221" fill="#ff5e6c">5V</text>
    <circle cx="768" cy="246" r="6" fill="#b9a3ae"/><text x="784" y="251" fill="#b9a3ae">GND</text>
    <circle cx="768" cy="276" r="6" fill="#ffd166"/><text x="784" y="281" fill="#ffd166">RX · 44</text>
    <circle cx="768" cy="306" r="6" fill="#4cc9f0"/><text x="784" y="311" fill="#4cc9f0">TX · 43</text>
  </g>
  <!-- right side: what else is wired -->
  <g font-size="14" fill="#f7e3ec">
    <text x="1004" y="236" text-anchor="end">12 · 11 · 10 · 9 · 8 · 7</text>
    <text x="1004" y="254" text-anchor="end" fill="#a88f9b" font-size="12">экран</text>
    <text x="1004" y="300" text-anchor="end">4 · 5 · 6</text>
    <text x="1004" y="318" text-anchor="end" fill="#a88f9b" font-size="12">кнопки</text>
    <text x="1004" y="364" text-anchor="end">1 · 2 · 13</text>
    <text x="1004" y="382" text-anchor="end" fill="#a88f9b" font-size="12">драйвер мотора</text>
    <text x="1004" y="428" text-anchor="end">3V3 · GND</text>
    <text x="1004" y="446" text-anchor="end" fill="#a88f9b" font-size="12">питание экрана</text>
  </g>
  <g stroke="#4a3b44" stroke-width="2" fill="none">
    <path d="M1018 242 H1060 V640"/>
    <path d="M1018 306 H1086 V700"/>
    <path d="M1018 370 H1112 V760"/>
  </g>

  <!-- ============ peripherals ============ -->
  <g>
    <rect x="520" y="620" width="520" height="56" rx="12" fill="#151016" stroke="#2a2029"/>
    <text x="540" y="644" font-size="15" font-weight="700" fill="#ff8db5">Экран ST7789 1.9″</text>
    <text x="540" y="664" font-size="13" fill="#f7e3ec">SCL→12  SDA→11  RES→8  DC→9  CS→10  BLK→7  VCC→3V3 (не 5V!)  GND→GND</text>
    <circle cx="1060" cy="648" r="5" fill="#4a3b44"/>

    <rect x="520" y="684" width="546" height="56" rx="12" fill="#151016" stroke="#2a2029"/>
    <text x="540" y="708" font-size="15" font-weight="700" fill="#ff8db5">Кнопки</text>
    <text x="540" y="728" font-size="13" fill="#f7e3ec">ВВЕРХ→4  ВНИЗ→5  OK→6, вторая нога на GND (без резисторов)</text>
    <circle cx="1086" cy="712" r="5" fill="#4a3b44"/>

    <rect x="520" y="748" width="572" height="56" rx="12" fill="#151016" stroke="#2a2029"/>
    <text x="540" y="772" font-size="15" font-weight="700" fill="#ff8db5">TMC2209 + NEMA17 (потом)</text>
    <text x="540" y="792" font-size="13" fill="#f7e3ec">STEP→1  DIR→2  EN→13  GND общий;  VM: свой блок 12–24 В</text>
    <circle cx="1112" cy="776" r="5" fill="#4a3b44"/>
  </g>

  <!-- ============ notes ============ -->
  <g font-size="14">
    <text x="40" y="540" font-weight="700" fill="#ff8db5">гребёнка Pi, внешний ряд от края с SD-картой:</text>
    
    <text x="40" y="572" fill="#ff5e6c">● пин 2 · 5V → ESP 5V</text>
    <text x="40" y="596" fill="#b9a3ae">● пин 6 · GND → ESP GND</text>
    <text x="40" y="620" fill="#ffd166">● пин 8 · GPIO14 TX → ESP RX (44)</text>
    <text x="40" y="644" fill="#4cc9f0">● пин 10 · GPIO15 RX → ESP TX (43)</text>
    <text x="40" y="684" fill="#a88f9b">TX и RX накрест</text>
    <text x="40" y="706" fill="#a88f9b">обе платы 3,3 В: преобразователь не нужен</text>
    
    <text x="40" y="728" fill="#a88f9b">короткие провода (до 30 см)</text>
    <text x="40" y="750" fill="#a88f9b">соединять без питания</text>
    <text x="40" y="840" fill="#6b5560" font-size="12">Super Mini: сверь надписи TX / RX / 5V на своей плате</text>
  </g>
</svg>
