<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Onest, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="85%" cy="0%" r="70%">
      <stop offset="0" stop-color="#ff4f9a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c151e"/>
      <stop offset="1" stop-color="#151016"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="860" fill="#0a080b"/>
  <rect width="1200" height="860" fill="url(#glow)"/>

  <text x="40" y="52" font-size="30" font-weight="800" fill="#ff8db5">SpinPrinter</text>
  <text x="232" y="52" font-size="20" font-weight="600" fill="#a88f9b">wiring</text>

  <!-- ============ Raspberry Pi ============ -->
  <rect x="40" y="130" width="440" height="300" rx="18" fill="url(#board)" stroke="#2a2029" stroke-width="2"/>
  <text x="70" y="250" font-size="24" font-weight="800" fill="#f7e3ec">Raspberry Pi</text>
  <text x="70" y="276" font-size="15" fill="#a88f9b">Pi 3 · 4 · 5 · Zero 2 W</text>
  <rect x="28" y="236" width="14" height="70" rx="3" fill="#2a2029"/>
  <text x="18" y="330" font-size="13" fill="#a88f9b">SD</text>
  <g fill="#2a2029" stroke="#4a3b44">
    <rect x="470" y="160" width="26" height="46" rx="4"/>
    <rect x="470" y="220" width="26" height="46" rx="4"/>
    <rect x="470" y="290" width="26" height="46" rx="4"/>
    <rect x="470" y="350" width="26" height="62" rx="4"/>
  </g>
  <text x="446" y="152" font-size="13" fill="#a88f9b" text-anchor="end">USB</text>
  <rect x="96" y="420" width="34" height="18" rx="4" fill="#2a2029" stroke="#4a3b44"/>
  <rect x="300" y="420" width="62" height="20" rx="4" fill="#2a2029" stroke="#4a3b44"/>
  <text x="113" y="466" font-size="14" fill="#f7e3ec" text-anchor="middle">power</text>
  <text x="113" y="484" font-size="13" fill="#a88f9b" text-anchor="middle">5 V, 2.5–5 A by model</text>
  <text x="331" y="466" font-size="14" fill="#f7e3ec" text-anchor="middle">HDMI</text>
  <text x="331" y="484" font-size="13" fill="#a88f9b" text-anchor="middle">→ projector (micro-HDMI on Pi 4/5)</text>

  <!-- ============ the USB cable ============ -->
  <path d="M496 183 H620 C 700 183, 700 600, 790 600 H880 V574" fill="none" stroke="#ff8db5" stroke-width="5" stroke-linecap="round"/>
  <rect x="486" y="360" width="200" height="64" rx="14" fill="#0a080b" stroke="#2a2029"/>
  <text x="586" y="384" font-size="15" font-weight="700" fill="#ff8db5" text-anchor="middle">USB cable</text>
  <text x="586" y="402" font-size="12" fill="#a88f9b" text-anchor="middle">USB-A ↔ USB-C, with data</text>
  <text x="586" y="417" font-size="12" fill="#a88f9b" text-anchor="middle">power and data for the board</text>

  <!-- ============ ESP32-S3 Super Mini ============ -->
  <rect x="768" y="140" width="250" height="420" rx="16" fill="url(#board)" stroke="#ff4f9a" stroke-opacity=".55" stroke-width="2"/>
  <rect x="855" y="548" width="50" height="22" rx="8" fill="#2a2029" stroke="#4a3b44"/>
  <text x="880" y="540" font-size="13" fill="#a88f9b" text-anchor="middle">USB-C</text>
  <text x="893" y="172" font-size="18" font-weight="800" fill="#f7e3ec" text-anchor="middle">ESP32-S3 Super Mini</text>
  <text x="893" y="192" font-size="12" fill="#a88f9b" text-anchor="middle">pins are GPIO numbers</text>
  <g font-size="14" fill="#f7e3ec">
    <text x="1004" y="236" text-anchor="end">43 · 44 · 1 · 2 · 3 · 4</text>
    <text x="1004" y="254" text-anchor="end" fill="#a88f9b" font-size="12">screen</text>
    <text x="1004" y="300" text-anchor="end">13 · 11 · 12</text>
    <text x="1004" y="318" text-anchor="end" fill="#a88f9b" font-size="12">joystick</text>
    <text x="1004" y="364" text-anchor="end">5 · 6 · 7</text>
    <text x="1004" y="382" text-anchor="end" fill="#a88f9b" font-size="12">motor driver</text>
    <text x="1004" y="428" text-anchor="end">3V3 · GND</text>
    <text x="1004" y="446" text-anchor="end" fill="#a88f9b" font-size="12">screen + joystick power</text>
  </g>
  <g stroke="#4a3b44" stroke-width="2" fill="none">
    <path d="M1018 242 H1060 V640"/>
    <path d="M1018 306 H1086 V700"/>
    <path d="M1018 370 H1112 V760"/>
  </g>

  <!-- ============ what is wired to the board ============ -->
  <g>
    <rect x="490" y="620" width="550" height="56" rx="12" fill="#151016" stroke="#2a2029"/>
    <text x="510" y="644" font-size="15" font-weight="700" fill="#ff8db5">Screen ST7789 2.4″ 240×320</text>
    <text x="510" y="664" font-size="13" fill="#f7e3ec">SCL→43  SDA→44  RES→1  DC→2  CS→3  BLK→4  VCC→3V3 (not 5V!)  GND→GND</text>
    <circle cx="1060" cy="648" r="5" fill="#4a3b44"/>

    <rect x="490" y="684" width="576" height="56" rx="12" fill="#151016" stroke="#2a2029"/>
    <text x="510" y="708" font-size="15" font-weight="700" fill="#ff8db5">Joystick KY-023</text>
    <text x="510" y="728" font-size="13" fill="#f7e3ec">VRx→13  VRy→11  SW→12  +5V→3V3 (not 5V!)  GND→GND</text>
    <circle cx="1086" cy="712" r="5" fill="#4a3b44"/>

    <rect x="490" y="748" width="602" height="56" rx="12" fill="#151016" stroke="#2a2029"/>
    <text x="510" y="772" font-size="15" font-weight="700" fill="#ff8db5">TMC2209 + NEMA17</text>
    <text x="510" y="792" font-size="13" fill="#f7e3ec">STEP→5  DIR→6  EN→7  common GND;  VM: its own 12–24 V supply</text>
    <circle cx="1112" cy="776" r="5" fill="#4a3b44"/>
  </g>

  <!-- ============ notes ============ -->
  <g font-size="14">
    <text x="40" y="560" font-weight="700" fill="#ff8db5">The board and the Pi: one USB cable.</text>
    <text x="40" y="586" fill="#a88f9b">A charge-only cable shows no port: take another.</text>
    <text x="40" y="630" fill="#f7e3ec">Screen and joystick get 3V3, never 5V.</text>
    <text x="40" y="674" fill="#a88f9b">Leave the stick alone at power-up:</text>
    <text x="40" y="696" fill="#a88f9b">it takes its centre then.</text>
    <text x="40" y="740" fill="#a88f9b">Power off while wiring.</text>
    <text x="40" y="832" fill="#6b5560" font-size="12">Super Mini: check the pin numbers printed on your board</text>
  </g>
</svg>
